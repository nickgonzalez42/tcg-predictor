     aria-label="Cyberpunk card back">
  <defs>
    <linearGradient id="cp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a08"/>
      <stop offset="1" stop-color="#0a0a05"/>
    </linearGradient>
  </defs>
  <rect width="300" height="420" rx="16" fill="url(#cp-bg)"/>
  <rect x="12" y="12" width="276" height="396" rx="10" fill="none" stroke="#6b6410" stroke-width="2"/>
  <g fill="#f2e30d">
    <rect x="96" y="168" width="108" height="10"/>
    <rect x="118" y="186" width="86" height="10"/>
    <rect x="96" y="204" width="64" height="10"/>
    <rect x="170" y="204" width="34" height="10"/>
  </g>
  <g fill="none" stroke="#f2e30d" stroke-width="2">
