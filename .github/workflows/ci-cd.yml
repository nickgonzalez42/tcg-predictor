name: CI

# A build check only. Until 2026-11-27 a push to main also DEPLOYED the API
# and the client from here and restarted the API. That deploy knew nothing of
# the server's routing rules, the crawler pages, the guides or the cache
# warm-up, so on 2026-11-24 the site ran half-deployed (new menu links opened
# a not-found page) and every push, pipeline-only ones included, restarted the
# API with cold caches. Deploys now go one way: deploy/deploy_app.sh, run from
# the pipeline machine.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish (self-contained linux-x64)
        run: dotnet publish dotnet/API -c Release -r linux-x64 --self-contained true -o api-out

  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build (tsc + vite)
        working-directory: client
        run: |
          npm ci
          npm run build
